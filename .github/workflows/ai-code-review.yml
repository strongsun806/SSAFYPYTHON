name: Automated GPT Code Review & Auto Merge on Push

on:
  push:
    branches-ignore:
      - main

jobs:
  auto-pr-review-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request automatically
        id: cpr
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          PR_URL=$(gh pr list --head "$BRANCH_NAME" --base main --json url --jq '.[0].url')
          
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --title "auto: merge $BRANCH_NAME to main" \
                                 --body "Automated PR triggered by push on $BRANCH_NAME" \
                                 --base main \
                                 --head "$BRANCH_NAME")
          fi
          
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
          PR_NUMBER=$(echo "$PR_URL" | awk -F'/' '{print $NF}')
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Get PR Diff
        id: get_diff
        run: |
          gh pr diff "$PR_NUMBER" > pr_diff.txt
          echo "DIFF_EXISTS=$(if [ -s pr_diff.txt ]; then echo 'true'; else echo 'false'; fi)" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GPT Code Review
        if: steps.get_diff.outputs.DIFF_EXISTS == 'true'
        run: |
          DIFF_CONTENT=$(cat pr_diff.txt | jq -sR .)
          
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"당신은 꼼꼼한 코드 리뷰어입니다. 변경된 디프(diff)를 보고 한국어로 친절하게 리뷰해 주세요.\"},
                {\"role\": \"user\", \"content\": $DIFF_CONTENT}
              ]
            }")

          COMMENT_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge PR
        run: gh pr merge --squash --admin "$PR_URL"
        env:
          PR_URL: ${{ env.PR_URL }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}